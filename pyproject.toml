[project]
name = "job-application-agent"
version = "0.1.0"
description = "Personal job application agent (Milestone 1: local backend)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m 'not e2e'"
markers = ["e2e: end-to-end browser tests (run with: pytest -m e2e)"]
