<header>
  <h1>Job Application Agent</h1>
  <nav aria-label="Main">
    <a routerLink="/find" routerLinkActive="active">Find jobs</a>
    <a routerLink="/jobs" routerLinkActive="active">Jobs</a>
    <a routerLink="/add" routerLinkActive="active">Add job</a>
    <a routerLink="/applications" routerLinkActive="active">Applications</a>
    <a routerLink="/profile" routerLinkActive="active">Profile</a>
  </nav>
  <span class="ai" data-testid="ai-status">{{ aiText() }}</span>
  @if (passwordOn()) {
    <button class="secondary" type="button" (click)="signOut()">Sign out</button>
  }
</header>
<main>
  <router-outlet />
</main>
