# Start:  docker compose up --build      Stop:  docker compose down
# Open:   http://127.0.0.1:8000
services:
  app:
    build: .
    image: job-application-agent:local
    ports:
      - "127.0.0.1:8000:8000"          # only reachable from this Mac, not from your network
    volumes:
      - ./data:/app/data               # your database and logs stay in ./data on your Mac
    env_file:
      - path: .env
        required: false                # APP_PASSWORD etc. (optional, git-ignored)
    environment:
      OLLAMA_URL: http://host.docker.internal:11434   # the Ollama app running on your Mac
    restart: unless-stopped
